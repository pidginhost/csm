# CSM integration profile for phpanel-server-agent hosts.
#
# Copy or symlink this file to /etc/csm/conf.d/00-phpanel.yaml to apply it.
#
# This profile assumes:
#   - The host is NOT running cPanel/WHM.
#   - Tenant web roots live under <home_base>/<user>/public_html.
#   - Mail logs are read from systemd-journald (configured in P4).
#   - phpanel-server-agent owns its own conf.d fragments under /etc/csm/conf.d/
#     and never edits the operator's main config directly.

# Web account roots are not set here. The agent renders account_roots in its
# runtime fragment, because only the agent knows the panel's home_base
# (/home unless changed). Lists append across conf.d fragments, so a default
# in this profile could not be replaced, only added to.

# Future schema, kept as comments until P4 wires the journald reader.
#
# mail_logs:
#   source: journal
#   units:
#     - postfix
#     - dovecot

# phpanel-server-agent supplies these via its own fragment (10-phpanel-runtime.yaml).
# Listed here as documentation of what the agent is expected to fill in.
#
# infra_ips:
#   - <panel ip>
#   - <agent control plane ip>
#
# The agent rewrites 10-phpanel-runtime.yaml on every bootstrap. After a
# rewrite it re-hashes only its own fragments:
#
#   csm rehash --fragment 10-phpanel-runtime.yaml
#
# That refuses when anything else under conf.d, the main config or the binary
# changed, so the agent never approves an edit it did not make. Where
# `csm capabilities` lacks confd.rehash.fragment.v1, leave the file out of the
# conf.d hash instead: list it in the MAIN config (not in a fragment) and
# rehash once:
#
#   confd:
#     integrity_exempt:
#       - 10-phpanel-runtime.yaml
#
# When the agent enables the firewall, declare the port it dials its control
# plane on in its fragment so `csm doctor` reports a policy that drops it:
#
# firewall:
#   required_tcp_out:
#     - <control plane port>

# Webhook + token configuration belongs in the agent's runtime fragment
# (10-phpanel-runtime.yaml). Do not put active placeholder secrets in this
# profile: conf.d sequence merging appends token lists, so placeholders can
# remain valid after a later fragment adds the real token.
#
# The agent renders an admin token that only it holds and binds the web UI to
# loopback. The panel never talks to CSM directly; it reaches CSM through the
# agent. Tokens expire only when expires_at is set; issued_at is optional.
# When rotating, replace the token and update any dates together, then
# restart CSM.
#
# alerts:
#   webhook:
#     enabled: true
#     type: phpanel
#     url: https://panel.example.com/api/csm/findings
#     hmac_secret_env: CSM_PHPANEL_HMAC
#
# webui:
#   enabled: true
#   listen: 127.0.0.1:9443
#   tokens:
#     - name: phpanel-agent
#       token: <agent-generated-secret>
#       scope: admin
#       issued_at: ""   # optional UTC RFC3339 issue time
#       expires_at: ""  # optional UTC RFC3339 expiry; empty never expires

# === P4: Mail-stack adaptations ===

# Mail logs read from systemd-journald (no rsyslog dependency on phpanel hosts).
mail_logs:
  source: journal
  units:
    - postfix
    - dovecot

# Per-account brute-force scoring keys on dovecot's user=<...> field by default.
# Operators with custom log formats override this in a higher-numbered fragment.
thresholds:
  mail_brute_account_key: "builtin:dovecot-user"

# Rspamd scoring source. Agent supplies token_env via runtime fragment / env.
#
# Upstream threat-intel stays off. phpanel does not serve an upstream lookup;
# an operator who runs a service implementing the upstream contract sets its
# URL in a higher-numbered fragment. The token is resolved from
# CSM_UPSTREAM_TOKEN at query time.
reputation:
  rspamd:
    enabled: true
    url: http://127.0.0.1:11334
    # token_env: CSM_RSPAMD_TOKEN  # operator/agent supplies
  upstream:
    enabled: false
    # url: https://ti.example.com/csm
    token_env: CSM_UPSTREAM_TOKEN
    cache_ttl_min: 15
    timeout_sec: 5

# === P5: Operational safety ===

# Phpanel hosts default to auto_response dry-run for safety. Operators
# flip dry_run to false in a higher-numbered conf.d fragment after a
# soak period confirms the would-be blocks look right in the dry-run log.
#
# Verdict callback: phpanel can observe each block decision before it's
# applied. Disabled here; the agent turns it on and supplies the URL in its
# runtime fragment. The panel signs its responses, so
# require_response_signature stays true. Token resolves from
# CSM_VERDICT_HMAC at call time.
auto_response:
  enabled: true
  block_ips: true
  dry_run: true
  verdict_callback:
    enabled: false                       # the agent turns it on with the runtime URL
    # url: https://panel.example.com/api/csm/verdict
    hmac_secret_env: CSM_VERDICT_HMAC
    allow_unsigned: false
    require_response_signature: true
    timeout_sec: 2
