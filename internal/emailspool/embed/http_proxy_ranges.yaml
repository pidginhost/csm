# Callers whose requests are not a browser visitor: CDN and website
# firewall front ends (Cloudflare, QUIC.cloud, Fastly, BunnyCDN, Amazon
# CloudFront, Sucuri) and payment gateway webhook senders. Every per-IP PHP
# relay path skips these addresses, so a CDN edge or a payment gateway
# reaching many sites is not read as one visitor.
#
# Uptime monitors and cron services are left out on purpose: anyone with an
# account there can schedule POSTs with any form body to any URL, so
# exempting them would let a bot relay form spam through them unseen.
#
# CSM ships this list in its binary. A file with this name in the
# php_relay policies_dir replaces it whole (same schema; a bare IP counts
# as /32 or /128); the daemon reloads it on SIGHUP. Each block is a
# snapshot of the provider's published list; fetch its source URL again
# to refresh it.

