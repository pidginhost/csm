# csm-challenge per-site rule -- managed by CSM, do not edit
# Apache site blocks do not inherit server-wide rewrite rules, so every
# site block must read this file. cPanel includes it in each site block;
# on other Apache servers add an Include line for this file inside every
# <VirtualHost>. Validation paths stay reachable so certificate renewal
# keeps working.

RewriteEngine On
RewriteMap csm_chal "txt:{{ .ChallengeMapPath }}"

RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteCond ${csm_chal:%{REMOTE_ADDR}} =challenge
RewriteRule ^/(.*)$ {{ .ChallengePublicURL }}?dest=%{REQUEST_SCHEME}://%{HTTP_HOST}/$1 [R=302,L]
