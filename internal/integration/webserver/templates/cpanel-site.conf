# csm-challenge per-site rule -- managed by CSM, do not edit
# cPanel includes this file in every site block. HTTPS site blocks do not
# inherit the server-wide csm-challenge.conf, so without it challenged
# visitors get normal HTTPS pages. Validation paths stay reachable so
# certificate renewal keeps working.

RewriteEngine On
RewriteMap csm_chal "txt:{{ .ChallengeMapPath }}"

RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteCond ${csm_chal:%{REMOTE_ADDR}} =challenge
RewriteRule ^/(.*)$ {{ .ChallengePublicURL }}?dest=%{REQUEST_SCHEME}://%{HTTP_HOST}/$1 [R=302,L]
