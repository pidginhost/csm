{{define "title"}}Cleanup History{{end}}
{{define "page"}}cleanup-history{{end}}
{{define "content"}}
    <div class="csm-page-header mb-3">
        <div class="csm-page-header__main">
            <h1 class="csm-page-header__title"><i class="ti ti-history"></i>&nbsp;Cleanup History</h1>
            <div class="csm-page-header__subtitle">File backups, pre-clean backups included, are on the <a href="/quarantine">Quarantine</a> page.</div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 class="card-title" id="cleanup-db-title"><i class="ti ti-database"></i>&nbsp;DB Object Backups</h2>
        </div>
        <div class="csm-toolbar">
            <input type="text" id="cleanup-db-search" class="form-control form-control-sm csm-toolbar__search" placeholder="Search DB backups..." aria-label="Search DB backups">
        </div>
        <div id="cleanup-db-content">
            <div class="card-body text-center text-muted py-4"><span class="spinner-border spinner-border-sm"></span> Loading...</div>
        </div>
    </div>
{{end}}
{{define "scripts"}}
<script src="{{asset "js/cleanup-history.js"}}"></script>
{{end}}
{{template "layout" .}}
