<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSM - Login</title>
    <link rel="stylesheet" href="{{asset "css/tabler.min.css"}}">
    <link rel="stylesheet" href="{{asset "css/csm.css"}}">
    <script src="{{asset "js/theme-init.js"}}"></script>
</head>
<body class="d-flex flex-column">
    <div class="page page-center">
        <div class="container container-tight py-4">
            <div class="card card-md">
                <div class="card-body">
                    <h2 class="h2 text-center mb-4">CSM - Continuous Security Monitor</h2>
                    {{if .Error}}<div class="alert alert-danger">{{.Error}}</div>{{end}}
                    <form id="login-form" method="POST" action="/login" autocomplete="off">
                        <div class="mb-3">
                            <label class="form-label" for="login-token">Authentication Token</label>
                            <input type="password" name="token" id="login-token" class="form-control" placeholder="Enter token" autofocus required>
                        </div>
                        <div class="form-footer">
                            <button type="submit" id="login-submit" class="btn btn-primary w-100">Sign In</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="{{asset "js/login.js"}}"></script>
</body>
</html>
