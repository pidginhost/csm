version: "2"

run:
  # Package loading, not analysis, is what approaches this limit, and it grows
  # with runner concurrency: a quiet pipeline loads in ~180s while a tag
  # pipeline running every job at once exceeded 300s and failed a release.
  timeout: 10m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - misspell
    - bodyclose
    - nilerr
    - unparam

  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintln
        - fmt.Fprintf
        - fmt.Printf
        - fmt.Sscanf
        - (io.Closer).Close
        - (*os.File).Close
    govet:
      enable-all: true
      disable:
        - fieldalignment
  exclusions:
    rules:
      # errcheck reports a bare receive from a chan error. In tests a bare
      # receive joins a goroutine whose result is already checked or no
      # longer needed, and staticcheck rejects the `_ = <-ch` alternative.
      - path: _test\.go
        linters:
          - errcheck
        source: '^\s*(case )?<-\w+:?\s*$'
      # unparam guards production signatures. Test helpers take fixed
      # arguments on purpose.
      - path: _test\.go
        linters:
          - unparam
      # A parameter every caller fills with one value is often the point: a
      # named threshold, a permission, a bucket name.
      - linters:
          - unparam
        text: always receives
      # Control handlers share one signature so the dispatch switch stays
      # uniform; some cannot fail.
      - linters:
          - unparam
        text: 'ControlListener\)\.handle\w+ - result 1 \(error\) is always nil'

formatters:
  enable:
    - gofmt
    - goimports

formatters-settings:
  goimports:
    local-prefixes: github.com/pidginhost/csm

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
