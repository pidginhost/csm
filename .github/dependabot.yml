# This repository is published from an upstream mirror, so the branches
# Dependabot opens here are replaced on the next sync and its pull requests
# close on their own. Treat them as notifications: the update is applied
# upstream, and it arrives here with the following sync. Do not spend time
# reopening or merging them.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      go-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
