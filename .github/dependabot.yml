# This repository is published from an upstream mirror, so a branch
# Dependabot opens here is replaced on the next sync and its pull request
# closes on its own. Pull requests are therefore switched off; security
# alerts still arrive, and the update is applied upstream and arrives with
# the following sync.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      go-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
