name: CodeQL

# CodeQL static analysis for Go. Runs on push to main, on pull requests
# against main, and on a weekly schedule so newly-disclosed query rules
# find old code. Results land in the repository's Security tab.
#
# Actions pinned by SHA per OpenSSF Scorecard recommendation.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sundays 04:17 UTC. Staggered off the top of the hour.
    - cron: '17 4 * * 0'

permissions:
  contents: read              # least-privilege default for the workflow

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Go
    # Pinned rather than ubuntu-latest: that label migrates to Ubuntu 26
    # from 2026-10-19, and every action here is pinned by commit for the
    # same reason. Move this deliberately, with a run to check it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # upload SARIF to the Security tab
      actions: read           # read workflow metadata
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          languages: go
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          category: "/language:go"
